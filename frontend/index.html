<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AIGen CV - Pro Resume Builder</title>
    <!-- Tailwind CSS (CDN, tanpa build step) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome & Google Fonts -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
    <!-- html2pdf.js: render CV bersih (tanpa watermark) menjadi file PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        heading: ['Poppins', 'sans-serif']
                    },
                    colors: {
                        primary: '#4F46E5', // Indigo 600
                        secondary: '#E8E2D9', // Krem untuk template CV
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #F3F4F6; -webkit-font-smoothing: antialiased; }
        h1, h2, h3 { text-wrap: balance; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in { animation: fadeIn .4s ease; }
        @keyframes fadeUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-up { animation: fadeUp .5s cubic-bezier(0.22, 1, 0.36, 1) both; }
        p { text-wrap: pretty; }

        /* CSS Khusus untuk Kertas CV (Rasio A4) */
        .cv-paper {
            width: 794px;
            height: 1123px;
            background: white;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            border-radius: 10px;
            position: relative;
            overflow: hidden;
            transform-origin: top center;
        }

        /* Watermark Overlay */
        .watermark-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(255, 255, 255, 0.2);
            z-index: 50;
            display: flex;
            justify-content: center;
            align-items: center;
            pointer-events: none;
            overflow: hidden;
        }

        .watermark-text {
            font-size: 5rem;
            color: rgba(0, 0, 0, 0.08);
            font-weight: 800;
            transform: rotate(-35deg);
            white-space: nowrap;
            user-select: none;
            text-align: center;
            line-height: 1.2;
        }

        /* Layout Grid untuk Template CV01 (Kreatif 2 Kolom) */
        .cv-layout-kreatif {
            display: grid;
            grid-template-columns: 280px 1fr;
            height: 100%;
        }

        .cv-sidebar { background-color: #E8E2D9; padding: 40px 30px; }
        .cv-main { padding: 50px 40px; }

        /* Scrollbar kustom untuk editor */
        .editor-scroll::-webkit-scrollbar { width: 6px; }
        .editor-scroll::-webkit-scrollbar-track { background: #f1f1f1; }
        .editor-scroll::-webkit-scrollbar-thumb { background: #c1c1c1; border-radius: 4px; }
    </style>
</head>
<body class="text-gray-800">
    <div id="root"></div>
    <!-- Host off-screen untuk render PDF bersih (tanpa watermark) -->
    <div id="pdf-host" style="position: fixed; left: -9999px; top: 0; width: 794px;"></div>
    <script type="module" src="/src/main.tsx"></script>
</body>
</html>
